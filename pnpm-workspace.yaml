packages:
  - packages/*
  - apps/*
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # The test plugin adopts the patched local runtime used by Wrangler.
  - '@cloudflare/vitest-plugin@1.3.4'
  # These exact versions were already validated before the pnpm migration.
  - 'miniflare@5.20260930.0-alpha'
  - 'wrangler@4.145.0'
  - '@redocly/cli@2.57.0'
allowBuilds:
  esbuild: true
  workerd: true
  # This postinstall only displays a funding message.
  core-js-pure: false
