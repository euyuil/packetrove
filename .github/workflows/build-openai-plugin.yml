name: Build OpenAI plugin ZIP

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full lowercase SHA of a main revision with successful CI and plugin build tooling
        required: true
        type: string
      require_listing:
        description: Require complete publisher names and listing URLs (other review prerequisites remain manual)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Validate and build plugin ZIP
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      TARGET_COMMIT: ${{ inputs.commit }}
      REQUIRE_LISTING: ${{ inputs.require_listing }}
    steps:
      - name: Require an explicit full commit SHA
        run: |
          if [[ ! "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Use a full lowercase commit SHA."
            exit 1
          fi

      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the requested revision to be on main before running repository code
        run: |
          if [[ "$(git rev-parse HEAD)" != "$TARGET_COMMIT" ]]; then
            echo "::error::The checkout must match the requested commit."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Require successful main validation for the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/openai-plugin-artifact-gate.ts

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source, build ZIP, and verify archive bytes
        id: package
        run: |
          arguments=(--output-dir "$RUNNER_TEMP/packetrove-plugin-artifact")
          if [[ "$REQUIRE_LISTING" == "true" ]]; then
            arguments+=(--require-listing)
          fi
          pnpm plugin:build "${arguments[@]}"

      - name: Upload plugin ZIP and build information
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/packetrove-plugin-artifact/${{ steps.package.outputs.archive_name }}
            ${{ runner.temp }}/packetrove-plugin-artifact/SHA256SUMS
            ${{ runner.temp }}/packetrove-plugin-artifact/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record download location
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf '\n[Download plugin artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
