name: CI and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js and dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project validation
        run: pnpm check

      - name: Check whether this revision is still current
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" == "$latest_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: $GITHUB_SHA has been superseded by $latest_sha on main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Worker and static assets
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying."
            exit 1
          fi
          pnpm --filter @packetrove/worker run deploy \
            --tag "$GITHUB_SHA" \
            --message "GitHub Actions run $GITHUB_RUN_ID"

      - name: Verify production website, API, and MCP
        if: steps.revision.outputs.current == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "Production smoke check attempt $attempt of 3"
            if pnpm smoke https://packetrove.com; then
              echo "Deployed and verified $GITHUB_SHA at https://packetrove.com." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done
          echo "::error::Production smoke checks failed after deployment. Review the deployment and use the rollback procedure in docs/deployment.md."
          echo "Deployment completed for $GITHUB_SHA, but production smoke checks failed. Review the live service and the rollback procedure in docs/deployment.md." >> "$GITHUB_STEP_SUMMARY"
          exit 1
