name: Publish CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag to recover (for example cli-0.1.1)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-cli-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish CLI
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'cli-') &&
      !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a stable CLI tag on main before running repository code
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^cli-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::A stable CLI release tag is required."
            exit 1
          fi
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_sha" ]]; then
            echo "::error::The checkout must match the existing release tag."
            exit 1
          fi
          git merge-base --is-ancestor "$tag_sha" origin/main

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js without a package cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate release tag and its main CI result
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-release.ts release "$RELEASE_TAG"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project and independent CLI installations
        run: pnpm check

      - name: Pack CLI and preview publication
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/packetrove-artifacts"
          pnpm --filter @packetrove/cli pack --pack-destination "$RUNNER_TEMP/packetrove-artifacts"
          npm publish "$RUNNER_TEMP/packetrove-artifacts/packetrove-cli-$RELEASE_VERSION.tgz" --dry-run --json

      - name: Detect an existing version before publication
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/cli-release.ts registry "$RELEASE_TAG" "$RUNNER_TEMP/packetrove-artifacts/packetrove-cli-$RELEASE_VERSION.tgz"

      - name: Publish reviewed archive with npm trusted publishing
        if: steps.registry.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "$RUNNER_TEMP/packetrove-artifacts/packetrove-cli-$RELEASE_VERSION.tgz" --access public --registry=https://registry.npmjs.org/

      - name: Verify registry contents and the exact published CLI version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/cli-release.ts registry-verify "$RELEASE_TAG" "$RUNNER_TEMP/packetrove-artifacts/packetrove-cli-$RELEASE_VERSION.tgz"
          mkdir -p "$RUNNER_TEMP/packetrove-npm-consumer"
          : > "$RUNNER_TEMP/packetrove-consumer.npmrc"
          (
            cd "$RUNNER_TEMP/packetrove-npm-consumer"
            npm --cache "$RUNNER_TEMP/packetrove-consumer-cache" --userconfig "$RUNNER_TEMP/packetrove-consumer.npmrc" exec --yes --ignore-scripts --registry=https://registry.npmjs.org/ --package="@packetrove/cli@$RELEASE_VERSION" -- packetrove cidr cover 203.0.113.1 203.0.113.2 203.0.113.6 --json > "$RUNNER_TEMP/packetrove-published-result.json"
          )
          node scripts/cli-release.ts verify "$RUNNER_TEMP/packetrove-published-result.json"
          echo "Published and verified @packetrove/cli@$RELEASE_VERSION from $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
