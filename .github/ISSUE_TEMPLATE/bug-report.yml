name: Bug report / 报告问题
description: Report a problem with Packetrove. / 报告使用 Packetrove 时遇到的问题。
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Packetrove. You can write in English or Simplified Chinese.
        Issues are public. Use example addresses such as `203.0.113.1` or `2001:db8::1`; keep credentials and private network data out of your report.

        感谢你帮助改进 Packetrove，可以使用英文或简体中文填写。
        反馈会公开显示，请使用 `203.0.113.1` 或 `2001:db8::1` 等示例地址，不要填写凭据或私有网络数据。
  - type: textarea
    id: actual_behavior
    attributes:
      label: What happened? / 发生了什么？
      description: Describe the problem and the actual result. / 描述遇到的问题和实际结果。
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Explain how to reproduce the problem using example inputs. / 说明如何复现问题，输入请使用示例数据。
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected result / 预期结果
      description: What did you expect to happen? / 你希望得到什么结果？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (optional) / 使用环境（选填）
      description: Browser, operating system, or client and version. / 浏览器、操作系统或客户端及其版本。
