name: Bug report
description: Report a problem with Packetrove.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Packetrove.
        Issues are public. Use example addresses such as `203.0.113.1` or `2001:db8::1`; keep credentials and private network data out of your report.
  - type: textarea
    id: actual_behavior
    attributes:
      label: What happened?
      description: Describe the problem and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the problem using example inputs.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: Browser, operating system, or client and version.
