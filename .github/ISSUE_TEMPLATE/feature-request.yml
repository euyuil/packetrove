name: Feature request
description: Suggest an improvement to Packetrove.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your idea.
        Issues are public. Please keep credentials and private network data out of your request.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: suggested_feature
    attributes:
      label: Suggested feature (optional)
      description: How would you like Packetrove to help?
